[package]
name = "ugr-compositor"
version = "0.1.0"
edition = "2021"
description = "Shared native compositor and event loop for UGR rendering backends"
license = "MIT"

[dependencies]
pollster = "=0.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
skia-safe = "=0.99.0"
wgpu = "=30.0.1"
ugr-ui = { path = "../ugr-ui" }
ugr-webgl = { path = "../ugr-webgl" }
winit = "=0.30.13"
